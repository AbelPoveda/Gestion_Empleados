name: .NET CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore "Gestion_Empleados.slnx"

    - name: Build
      run: dotnet build "Gestion_Empleados.slnx" --no-restore --configuration Release

    - name: Test
      run: dotnet test "Gestion_Empleados.Tests/Gestion_Empleados.Tests.csproj" --configuration Release --verbosity normal

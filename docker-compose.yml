services:
  gestion_empleados:
    image: ${DOCKER_REGISTRY-}gestion_empleados
    build:
      context: .
      dockerfile: Gestion_Empleados/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8080:8080"
    depends_on:
      - db
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SqlPassword2026!
    ports:
      - "1433:1433"